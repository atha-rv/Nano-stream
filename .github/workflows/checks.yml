name: Camera utility checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest tools/nano-transfer/test_storage.py nano-monitor/camera/test_gallery.py nano-monitor/camera/test_server.py nano-monitor/camera/test_thumbnails.py tools/nano-transfer/test_prepare_dump.py -q
      - run: node --test nano-monitor/desktop/bridge.test.cjs nano-monitor/apps/web/app/monitor/gallery-model.test.mjs nano-monitor/design/foundation.test.cjs
      - run: python -m compileall -q nano-monitor/camera tools/nano-transfer
      - name: Parse desktop setup scripts
        shell: pwsh
        run: |
          foreach ($file in @('nano-monitor/Setup-Desktop.ps1', 'nano-monitor/Launch-Desktop.ps1')) {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
